# Cargo workspace with one example library crate. The root package is the
# crate; an instance that grows into several crates adds them under
# crates/ and to `members`. See docs/TEMPLATE.md.
[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Matches rust-toolchain.toml (major.minor is enough for MSRV semantics).
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/craftainer/lib-observability-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
name = "craftainer-observability"
description = "Health checks, JSON logging and OpenTelemetry for Axum services"
keywords = ["observability", "health-check", "axum", "logging", "opentelemetry"]
categories = ["web-programming", "asynchronous"]
readme = "README.md"
# Stays 0.0.0 in git: the release tag is the real version. `publish` is left
# at Cargo's default (true) and gated by the release contract's
# CARGO_PUBLISH switch, not here. crates.io also wants `keywords` (max 5) and
# `categories` (https://crates.io/category_slugs); an instance adds them.
# Only what a dependent needs goes into the .crate (the default would ship
# .devcontainer/, docs/, scripts/ and more).
include = ["/src/", "/tests/", "/README.md", "/LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Caret ranges (`x.y.z` means `^x.y.z`), not exact pins: a library must let
# its dependents unify versions. Cargo.lock still records the exact versions.
[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["json", "matched-path", "tokio"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
serde = { version = "1.0.229", features = ["derive"] }
# The JSON log lines.
serde_json = "1.0.151"
thiserror = "2.0.21"
# The request-ID layer: tower's two traits (not the full `tower` crate),
# `pin-project-lite` for its response future and `uuid` for a fresh ID.
pin-project-lite = "0.2.17"
tower-layer = "0.3.3"
tower-service = "0.3.3"
uuid = { version = "1.28.0", default-features = false, features = ["v4"] }
# `time` for the per-check timeout; `sync` for the Redis check's lazy connection.
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }

# Optional, one feature per backing service a ready-made check talks to.
aws-sdk-s3 = { version = "1.112.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
redis = { version = "1.7.0", optional = true, default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls"] }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "postgres"] }

# OTLP log export. "http-proto" over reqwest + rustls, not the default gRPC
# exporter, so the one reqwest/rustls stack serves every feature. The
# *blocking* reqwest client is deliberate: the batch processor exports from
# its own plain thread, where the async client panics ("there is no reactor
# running") and so exports nothing. "reqwest-rustls" makes https endpoints work.
opentelemetry = { version = "0.32.0", optional = true, default-features = false, features = ["logs", "trace", "metrics"] }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true, default-features = false }
opentelemetry-otlp = { version = "0.32.0", optional = true, default-features = false, features = ["logs", "trace", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.32.1", optional = true, default-features = false, features = ["logs", "trace", "metrics", "rt-tokio"] }
# Bridges `tracing` spans to OpenTelemetry spans (0.33 pairs with opentelemetry 0.32).
tracing-opentelemetry = { version = "0.33.0", optional = true, default-features = false }

[dev-dependencies]
aws-config = "1.8.11"
# The in-memory exporters the telemetry tests read spans and metrics from.
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
# All off by default: a service pulls in only the clients it has.
# `postgres`: `DatabaseHealthCheck` over an `sqlx::PgPool`. sqlx is built with
# no TLS backend here; see "sqlx TLS" in the README.
postgres = ["dep:sqlx"]
# `redis`: `RedisHealthCheck` (PING).
redis = ["dep:redis"]
# `s3`: `S3HealthCheck` (ListBuckets) over an `aws_sdk_s3::Client`.
s3 = ["dep:aws-sdk-s3"]
# `http`: `HttpHealthCheck` (GET a URL, expect 2xx).
http = ["dep:reqwest"]
# `testing`: `MockHealthCheck`, an always-healthy stub for tests and for
# modes that run without infrastructure. Off by default so production builds
# cannot register a check that always says healthy.
testing = []
# `otel`: `logs::configure_telemetry` also exports traces, metrics and logs
# over OTLP/HTTP when the standard `OTEL_EXPORTER_OTLP_*` endpoint variables
# are set, and the `otel` module (server spans, request metrics) is built.
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry-appender-tracing",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
]

[lints]
workspace = true

# Each needs a live service from the devcontainer and its feature.
[[test]]
name = "postgres_health_check"
required-features = ["postgres"]

[[test]]
name = "redis_health_check"
required-features = ["redis"]

[[test]]
name = "s3_health_check"
required-features = ["s3"]

[[test]]
name = "http_health_check"
required-features = ["http"]
